<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه منسوخ شده | گروه Aryon</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* پس‌زمینه متحرک */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.25), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.25), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15), transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* ذرات شناور */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* کارت اصلی */
        .card {
            position: relative;
            z-index: 10;
            max-width: 720px;
            width: 90%;
            padding: 60px 50px;
            background: rgba(20, 20, 30, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* آیکون هشدار */
        .icon-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .icon-wrapper::before,
        .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(245, 158, 11, 0.5);
            animation: ripple 2.5s ease-out infinite;
        }

        .icon-wrapper::after {
            animation-delay: 1.25s;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .icon-wrapper svg {
            width: 55px;
            height: 55px;
            stroke: #fff;
            stroke-width: 2.5;
        }

        /* عنوان */
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #f9a8d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        /* متن توضیحات */
        .description {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            line-height: 2;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 32px;
            font-weight: 300;
        }

        .description strong {
            color: #f9a8d4;
            font-weight: 700;
        }

        /* بج گروه */
        .group-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 50px;
            margin-bottom: 36px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .group-badge:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .group-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s;
        }

        .group-badge:hover::before {
            left: 100%;
        }

        .group-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 12px #a78bfa;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .group-badge span {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e9d5ff;
        }

        /* خط جداکننده */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #a78bfa, transparent);
            margin: 0 auto 28px;
            border-radius: 3px;
        }

        /* یادداشت پایین */
        .footer-note {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }

        /* ریسپانسیو */
        @media (max-width: 600px) {
            .card {
                padding: 45px 25px;
                border-radius: 24px;
            }

            .icon-wrapper {
                width: 85px;
                height: 85px;
            }

            .icon-wrapper svg {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="card">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>

        <div class="group-badge">
            <span class="dot"></span>
            <span>گروه Aryon</span>
        </div>

        <h1>این پروژه منسوخ شده است</h1>

        <div class="divider"></div>

        <p class="description">
            این پروژه دیگر پشتیبانی نمی‌شود و توسعه آن متوقف شده است.<br>
            لطفاً به‌جای استفاده از این نسخه، به <strong>نسخه‌های جدیدتر</strong> مراجعه کنید.
        </p>

        <p class="footer-note">
            © گروه Aryon — تمامی حقوق محفوظ است
        </p>
    </div>

    <script>
        // ساخت ذرات شناور
        const particlesContainer = document.getElementById('particles');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
            particle.style.animationDelay = (Math.random() * 10) + 's';
            particle.style.opacity = Math.random() * 0.6 + 0.2;
            
            const size = Math.random() * 3 + 1;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            // رنگ‌های متنوع
            const colors = ['#a78bfa', '#f9a8d4', '#60a5fa', '#ffffff'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
