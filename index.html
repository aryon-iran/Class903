<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060709" />
<meta name="description" content="Aryon | در حال ساخت هسته EUD — کلاس ۹۰۳" />
<title>Aryon | هسته EUD — کلاس ۹۰۳</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #060709;
    --text: #f4f7fa;
    --text-2: #a8b0bd;
    --text-3: #6b7280;
    --ice: #7dd3fc;
    --ice-2: #38bdf8;
    --ice-deep: #0ea5e9;
    --ice-soft: rgba(125, 211, 252, 0.08);
    --ice-border: rgba(125, 211, 252, 0.2);
    --glow: rgba(125, 211, 252, 0.5);
    --line: rgba(255, 255, 255, 0.06);
  }

  html, body {
    min-height: 100%;
    font-family: 'Vazirmatn', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* پس‌زمینه */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(125, 211, 252, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 80%);
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    to { background-position: 50px 50px; }
  }
  .bg-glow {
    position: absolute;
    top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1000px; height: 1000px;
    background: radial-gradient(circle, rgba(125, 211, 252, 0.12), transparent 60%);
    filter: blur(90px);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  }

  /* ذرات */
  #particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    opacity: 0.6;
  }

  /* کانتینر */
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 90px;
    text-align: center;
    position: relative;
  }

  /* لوگو */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
    animation: fadeUp 0.9s ease both;
  }
  .logo-img-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    display: grid;
    place-items: center;
  }
  .logo-img-wrap::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--ice-soft), transparent 70%);
    filter: blur(15px);
    animation: breathe 4s ease-in-out infinite;
  }
  .logo-img-wrap::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 26px;
    background: linear-gradient(135deg, var(--ice), var(--ice-2), transparent 70%);
    opacity: 0.6;
    filter: blur(8px);
    animation: spinGlow 8s linear infinite;
  }
  @keyframes spinGlow {
    to { transform: rotate(360deg); }
  }
  .logo-img {
    position: relative;
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 22px;
    border: 1px solid var(--ice-border);
    box-shadow:
      0 0 30px rgba(125, 211, 252, 0.4),
      0 0 60px rgba(125, 211, 252, 0.15),
      inset 0 0 20px rgba(0, 0, 0, 0.4);
    z-index: 1;
  }
  .logo-name {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--ice), #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* چرخ‌دنده‌ها */
  .gear-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    margin-bottom: 32px;
    display: grid;
    place-items: center;
    animation: fadeUp 0.9s 0.1s ease both;
  }
  .gear-wrap::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(125, 211, 252, 0.12), transparent 65%);
    filter: blur(20px);
    animation: breathe 4s ease-in-out infinite;
  }

  .gear {
    position: absolute;
    color: var(--ice);
    filter: drop-shadow(0 0 12px var(--glow));
    transform-origin: center;
  }
  .gear-1 {
    width: 100px; height: 100px;
    top: 50%; left: 50%;
    margin: -50px 0 0 -50px;
    animation: spin 8s linear infinite;
  }
  .gear-2 {
    width: 56px; height: 56px;
    top: 50%; left: 50%;
    margin: -28px 0 0 -28px;
    color: var(--ice-2);
    animation: spinReverse 5s linear infinite;
    filter: drop-shadow(0 0 10px var(--glow));
  }
  .gear-3 {
    width: 36px; height: 36px;
    top: calc(50% - 52px);
    left: calc(50% + 40px);
    color: var(--ice);
    opacity: 0.75;
    animation: spin 6s linear infinite;
    filter: drop-shadow(0 0 8px var(--glow));
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

  /* وضعیت */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--ice-soft);
    border: 1px solid var(--ice-border);
    border-radius: 30px;
    font-size: 0.82rem;
    color: var(--ice);
    font-weight: 500;
    margin-bottom: 24px;
    animation: fadeUp 0.9s 0.2s ease both;
    position: relative;
    overflow: hidden;
  }
  .status::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.15), transparent);
    transform: translateX(-100%);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    to { transform: translateX(100%); }
  }
  .dot {
    width: 7px; height: 7px;
    background: var(--ice);
    border-radius: 50%;
    box-shadow: 0 0 0 0 var(--glow);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--glow); }
    70% { box-shadow: 0 0 0 10px rgba(125, 211, 252, 0); }
    100% { box-shadow: 0 0 0 0 rgba(125, 211, 252, 0); }
  }

  /* تیتر کلاس */
  .class-tag {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--text-3);
    letter-spacing: 6px;
    margin-bottom: 12px;
    animation: fadeUp 0.9s 0.3s ease both;
  }
  .class-name {
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 22px;
    animation: fadeUp 0.9s 0.35s ease both;
  }
  .class-name span {
    background: linear-gradient(135deg, var(--ice), #e0f2fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
    position: relative;
    animation: glowText 3s ease-in-out infinite;
  }
  @keyframes glowText {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.4)); }
    50% { filter: drop-shadow(0 0 30px rgba(125, 211, 252, 0.8)); }
  }

  /* تیتر EUD با گلیچ */
  .eud-title {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 22px;
    animation: fadeUp 0.9s 0.4s ease both;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .eud-title .word {
    color: var(--text-0);
    color: #f4f7fa;
  }
  .eud-title .eud {
    position: relative;
    color: var(--ice);
    font-family: 'Courier New', monospace;
    letter-spacing: 3px;
    padding: 4px 12px;
    border: 1px solid var(--ice-border);
    border-radius: 8px;
    background: rgba(125, 211, 252, 0.06);
    text-shadow: 0 0 20px var(--glow);
    animation: eudPulse 2s ease-in-out infinite;
  }
  @keyframes eudPulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(125, 211, 252, 0.4);
      border-color: rgba(125, 211, 252, 0.3);
    }
    50% {
      box-shadow: 0 0 30px 4px rgba(125, 211, 252, 0.3);
      border-color: rgba(125, 211, 252, 0.7);
    }
  }

  /* توضیح */
  .sub {
    font-size: 1rem;
    color: var(--text-2);
    line-height: 2;
    max-width: 520px;
    margin-bottom: 36px;
    animation: fadeUp 0.9s 0.45s ease both;
  }
  .sub strong {
    color: var(--ice);
    font-weight: 600;
  }

  /* نوار پیشرفت */
  .progress-wrap {
    width: 100%;
    max-width: 420px;
    margin-bottom: 40px;
    animation: fadeUp 0.9s 0.5s ease both;
  }
  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-3);
    margin-bottom: 10px;
  }
  .progress-head .value {
    color: var(--ice);
    font-family: 'Courier New', monospace;
    font-weight: 700;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--line);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ice-deep), var(--ice), var(--ice-2));
    border-radius: 30px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    box-shadow: 0 0 20px var(--glow);
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    animation: shimmer2 2s infinite;
    border-radius: 30px;
  }
  @keyframes shimmer2 {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  /* جداکننده */
  .sep {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ice), transparent);
    margin-bottom: 30px;
    opacity: 0.5;
    animation: fadeUp 0.9s 0.55s ease both;
  }

  /* شبکه‌های اجتماعی */
  .socials {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.9s 0.6s ease both;
    flex-wrap: wrap;
    justify-content: center;
  }
  .socials a {
    display: grid;
    place-items: center;
    width: 46px; height: 46px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text-2);
    text-decoration: none;
    transition: 0.3s;
    position: relative;
  }
  .socials a:hover {
    border-color: var(--ice-border);
    color: var(--ice);
    background: var(--ice-soft);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(125, 211, 252, 0.15);
  }
  .socials svg { width: 20px; height: 20px; }
  .socials a::after {
    content: attr(data-label);
    position: absolute;
    bottom: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: var(--text-3);
    white-space: nowrap;
    opacity: 0;
    transition: 0.3s;
    pointer-events: none;
  }
  .socials a:hover::after {
    opacity: 1;
    bottom: -24px;
  }

  /* فوتر */
  .footer {
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-3);
    animation: fadeUp 0.9s 0.8s ease both;
    padding: 0 20px;
  }
  .footer a {
    color: var(--text-2);
    text-decoration: none;
    transition: 0.3s;
  }
  .footer a:hover { color: var(--ice); }

  /* انیمیشن ورود */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* موبایل */
  @media (max-width: 480px) {
    .wrap { padding: 30px 16px 100px; }
    .logo-img, .logo-img-wrap { width: 78px; height: 78px; }
    .gear-wrap { width: 100px; height: 100px; margin-bottom: 24px; }
    .gear-1 { width: 78px; height: 78px; margin: -39px 0 0 -39px; }
    .gear-2 { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
    .gear-3 { width: 28px; height: 28px; top: calc(50% - 40px); left: calc(50% + 30px); }
    .sub { font-size: 0.92rem; }
    .logo-name { font-size: 1.3rem; letter-spacing: 2px; }
    .socials a { width: 42px; height: 42px; }
    .class-name { letter-spacing: -1px; }
    .eud-title { font-size: 1.2rem; gap: 8px; }
    .eud-title .eud { padding: 3px 8px; font-size: 1rem; }
  }
</style>
</head>

<script>
  /* ───── نوار پیشرفت (با انیمیشن) ───── */
  const progressFill = document.getElementById('progressFill');
  const progressValue = document.getElementById('progressValue');

  // 🎯 درصد رو اینجا تنظیم کن (0 تا 100)
  const TARGET_PROGRESS = 68;

  const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

  let current = 0;
  setTimeout(() => {
    progressFill.style.width = TARGET_PROGRESS + '%';
    const interval = setInterval(() => {
      if (current >= TARGET_PROGRESS) {
        clearInterval(interval);
        return;
      }
      current++;
      progressValue.textContent = toFa(current) + '٪';
    }, 20);
  }, 800);

  /* ───── ذرات ───── */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 1.6 + 0.4;
      this.a = Math.random() * 0.5 + 0.2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > W) this.vx *= -1;
      if (this.y < 0 || this.y > H) this.vy *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = '#7dd3fc';
      ctx.globalAlpha = this.a;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#7dd3fc';
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  const count = window.innerWidth < 768 ? 40 : 80;
  particles = Array.from({ length: count }, () => new Particle());

  let mouse = { x: -9999, y: -9999 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });

    // خطوط بین ذرات نزدیک به موس
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (dm < 140) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = `rgba(125, 211, 252, ${0.25 * (1 - dm / 140)})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    requestAnimationFrame(loop);
  }
  loop();
</script>
